<h1>Mi Componente</h1>
<p>Este es un componente de ejemplo en Angular.</p>
<table>
  <tr>
    <td>Nombre:</td>
    <td>{{ nombre }}</td>
  </tr>
  <tr>
    <td>Apellido:</td>
    <td>{{ apellido }}</td>
  </tr>
  <tr>
    <td>Edad:</td>
    <td>{{ edad }}</td>
  </tr>
  <tr>
    <td>Fecha de Nacimiento:</td>
    <td>{{ fechaNacimiento | date:'dd/MM/yyyy' }}</td>
  </tr>
  <tr>
    <td>Dirección:</td>
    <td>{{ direccion }}</td>
  </tr>
